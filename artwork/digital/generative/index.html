Params(location.search).get('kind')==='14'?'./impasto/player.js?edition=15':new URLSearchParams(location.search).get('kind')==='13'?'./misfiled/player.js?edition=145':new URLSearchParams(location.search).get('kind')==='12'?'./squares/player.js?edition=145':Number(new URLSearchParams(location.search).get('kind'))>=9?'./biota/player.js?edition=145':new URLSearchParams(location.search).get('kind')==='8'?'./errata/player.js?edition=145':'./ravel/player.js?edition=145').catch(error=>{console.error(error);document.querySelector('[aria-label="Loading artwork"]')?.remove();document.querySelector('#error').style.display='block';});</script></body></html>
