<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyrone Moreno</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #ffffff; 
            font-family: 'Helvetica', 'Arial', sans-serif;
        }

        .top-left-logo {
            position: fixed; top: 25px; left: 25px;
            width: 120px; height: auto; z-index: 10; 
            pointer-events: auto; cursor: pointer; opacity: 0.9;
        }

        .footer {
            position: fixed; bottom: 25px; right: 25px;
            display: flex; align-items: center; gap: 15px;
            z-index: 10; pointer-events: auto; 
        }

        .footer a {
            text-decoration: none; color: #1a1a1a;
            font-size: 0.75rem; letter-spacing: 0.5px;
            opacity: 0.6; transition: opacity 0.3s ease; display: flex; align-items: center;
        }

        .ig-icon { width: 18px; height: 18px; filter: grayscale(100%); }

        .copyright {
            position: fixed; bottom: 25px; left: 25px;
            font-size: 0.5rem; color: #1a1a1a; letter-spacing: 0.8px; 
            opacity: 0.3; z-index: 10; pointer-events: none; 
        }

        #canvas { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: block; z-index: 1; cursor: none; touch-action: none; 
        }

        @media (max-width: 768px) {
            .top-left-logo { width: 90px; top: 20px; left: 20px; }
            .footer { bottom: 50px; right: 20px; flex-direction: column; align-items: flex-end; gap: 10px; }
            .footer a { font-size: 0.65rem; }
            .copyright { bottom: 15px; left: 20px; font-size: 0.4rem; opacity: 0.2; }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo" class="top-left-logo" id="btn-home">
    <div class="footer">
        <a href="mailto:tyronedmoreno@gmail.com">tyronedmoreno@gmail.com</a>
        <a href="https://instagram.com/imtyronemoreno" target="_blank">
            <img src="instagram.png" alt="Instagram" class="ig-icon">
        </a>
    </div>
    <div class="copyright">© 2026 Copyright | Tyrone Doyle Moreno | All Rights Reserved</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let lastX = 0, lastY = 0, lastTime = Date.now();
        const isMobile = window.innerWidth < 768;
        const brushBaseScale = isMobile ? 18 : 45;

        // Expanded Library of 23 Palettes
        const palettes = [
            ['#0a0a0a', '#ff3e00', '#0059ff', '#ffcc00', '#b5179e', '#ffffff', '#8a00d4'], // Neo-Exp Primaries
            ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51'], // Mediterranean
            ['#588157', '#a3b18a', '#dad7cd', '#3a5a40', '#344e41'], // Ghibli Forest
            ['#f72585', '#7209b7', '#3a0ca3', '#4361ee', '#4cc9f0'], // Cyber Neon
            ['#03071e', '#370617', '#6a040f', '#9d0208', '#d00000', '#dc2f02', '#e85d04', '#f48c06', '#faa307'], // Inferno
            ['#f4f1de', '#e07a5f', '#3d405b', '#81b29a', '#f2cc8f'], // Muted Earth
            ['#2b2d42', '#8d99ae', '#edf2f4', '#ef233c', '#d90429'], // High Contrast Red/Grey
            ['#ff99c8', '#fcf6bd', '#d0f4de', '#a9def9', '#e4c1f9'], // Pastel Surrealism
            ['#001219', '#005f73', '#0a9396', '#94d2bd', '#e9d8a6', '#ee9b00', '#ca6702', '#bb3e03', '#ae2012', '#9b2226'], // Deep Sea Sunset
            ['#1b1b1b', '#3d3d3d', '#717171', '#a9a9a9', '#e1e1e1', '#ffffff'], // Charcoal Sketch
            ['#606c38', '#283618', '#fefae0', '#dda15e', '#bc6c25'], // Savannah
            ['#cdb4db', '#ffc8dd', '#ffafcc', '#bde0fe', '#a2d2ff'], // Cotton Candy
            ['#22223b', '#4a4e69', '#9a8c98', '#c9ada7', '#f2e9e4'], // Dusky Lavender
            ['#003049', '#d62828', '#f77f00', '#fcbf49', '#eae2b7'], // Classic Poster
            ['#335c67', '#fff3b0', '#e09f3e', '#9e2a2b', '#540b0e'], // Autumnal Abstract
            ['#ffbe0b', '#fb5607', '#ff006e', '#8338ec', '#3a86ff'], // Pop Art Chaos
            ['#ef476f', '#ffd166', '#06d6a0', '#118ab2', '#073b4c'], // Retro Brights
            ['#111111', '#444444', '#ff0000', '#ffffff'], // Slasher / Minimalist
            ['#d8e2dc', '#ffe5d9', '#ffcad4', '#f4acb7', '#9d8189'], // Soft Flesh / Bone
            ['#2d6a4f', '#409167', '#52b788', '#74c69d', '#95d5b2', '#b7e4c7', '#d8f3dc'], // Emerald Flow
            ['#3d5a80', '#98c1d9', '#e0fbfc', '#ee6c4d', '#293241'], // Cold Steel & Fire
            ['#7400b8', '#6930c3', '#5e60ce', '#5390d9', '#48bfe3', '#4ea8de', '#56cfe1', '#64dfdf', '#72efdd', '#80ffdb'], // Electric Reef
            ['#1d3557', '#457b9d', '#a8dadc', '#f1faee', '#e63946'] // Naval Contrast
        ];

        function hexToRgb(hex) {
            let r = parseInt(hex.substring(1, 3), 16), g = parseInt(hex.substring(3, 5), 16), b = parseInt(hex.substring(5, 7), 16);
            return [r, g, b];
        }

        const activePalette = palettes[Math.floor(Math.random() * palettes.length)].map(hexToRgb);
        let bristles = [];

        function dipBrush() {
            bristles = [];
            const count = isMobile ? 45 : 95;
            for(let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.pow(Math.random(), 1.7);
                const color = activePalette[Math.floor(Math.random() * activePalette.length)];
                bristles.push({
                    ox: Math.cos(angle) * dist, oy: Math.sin(angle) * dist,
                    x: 0, y: 0, vx: 0, vy: 0,
                    color: [...color], res: [...color],
                    thickness: Math.random() * 3 + 0.4,
                    phase: Math.random() * 1000,
                    drift: 0.04 + Math.random() * 0.1,
                    mass: 0.1 + Math.random() * 0.4,
                    friction: 0.5 + Math.random() * 0.4,
                    isStray: Math.random() > 0.85,
                    lastBX: null, lastBY: null
                });
            }
        }

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resize);
        resize(); dipBrush();

        function draw(x, y, forceDip = false) {
            const now = Date.now(), delta = now - lastTime;
            if (delta > 200 || forceDip) { dipBrush(); lastX = x; lastY = y; }

            const dx = x - lastX, dy = y - lastY;
            const dist = Math.hypot(dx, dy);
            const velocity = Math.min(dist / (delta || 1), 25);
            
            if (dist > 1.5) {
                ctx.save();
                ctx.globalAlpha = 0.25;
                const smearSize = brushBaseScale * (1.2 + velocity * 0.08);
                ctx.translate(x, y);
                ctx.rotate(velocity * 0.02 * (Math.random() - 0.5));
                ctx.drawImage(canvas, -smearSize, -smearSize, smearSize*2, smearSize*2, -smearSize + (dx*0.25), -smearSize + (dy*0.25), smearSize*2, smearSize*2);
                ctx.restore();
            }

            const steps = Math.max(1, Math.floor(dist / 1.1));

            for (let s = 0; s < steps; s++) {
                const t = s / steps;
                const cx = lastX + dx * t;
                const cy = lastY + dy * t;

                bristles.forEach(b => {
                    b.phase += b.drift;
                    const harmonic = Math.pow(Math.abs(Math.sin(b.phase)), 3) * (1 + velocity * 0.15);
                    const currentThick = Math.min(10, b.thickness * (0.6 + harmonic * 4));

                    if (s % 4 === 0 && Math.random() > 0.55) {
                        const sx = Math.floor(cx + b.x), sy = Math.floor(cy + b.y);
                        if (sx > 0 && sx < canvas.width && sy > 0 && sy < canvas.height) {
                            const p = ctx.getImageData(sx, sy, 1, 1).data;
                            if (p[3] > 50) {
                                const pickRate = 0.18;
                                for(let j=0; j<3; j++) b.res[j] = b.res[j] * (1 - pickRate) + p[j] * pickRate;
                            }
                        }
                    }

                    const targetX = b.ox * brushBaseScale * (1 + velocity * 0.1);
                    const targetY = b.oy * brushBaseScale * (1 + velocity * 0.1);
                    
                    const fx_force = (targetX - b.x) * b.mass;
                    const fy_force = (targetY - b.y) * b.mass;
                    
                    b.vx = (b.vx + fx_force) * b.friction;
                    b.vy = (b.vy + fy_force) * b.friction;
                    
                    if (Math.random() > 0.95) {
                        b.vx += (Math.random() - 0.5) * velocity;
                        b.vy += (Math.random() - 0.5) * velocity;
                    }

                    b.x += b.vx; b.y += b.vy;
                    const fx = cx + b.x, fy = cy + b.y;

                    if (b.lastBX !== null) {
                        ctx.globalAlpha = Math.max(0.08, 0.9 - (velocity * 0.04));
                        ctx.strokeStyle = `rgb(${Math.round(b.res[0])}, ${Math.round(b.res[1])}, ${Math.round(b.res[2])})`;
                        ctx.lineCap = 'butt';
                        ctx.lineWidth = currentThick;
                        
                        ctx.beginPath();
                        ctx.moveTo(b.lastBX, b.lastBY);
                        ctx.lineTo(fx, fy);
                        ctx.stroke();

                        if (Math.random() > 0.998) b.res = [...activePalette[Math.floor(Math.random() * activePalette.length)]];
                    }
                    b.lastBX = fx; b.lastBY = fy;
                });
            }
            lastX = x; lastY = y; lastTime = now;
        }

        window.addEventListener('mousemove', e => draw(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', e => {
            if(!e.target.closest('.footer')) e.preventDefault();
            draw(e.touches[0].clientX, e.touches[0].clientY, true);
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            draw(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        document.getElementById('btn-home').addEventListener('click', () => {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
