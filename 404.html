<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<script>
  // Encode the path the user tried to access directly into the redirect URL
  // (query string), instead of sessionStorage. This survives a real top-level
  // navigation reliably, even across http->https / www redirects, unlike
  // sessionStorage which can fail to carry over on a live custom domain.
  var path = window.location.pathname + window.location.search + window.location.hash;
  window.location.replace('/?redirect=' + encodeURIComponent(path));
</script>
</head>
<body></body>
</html>
